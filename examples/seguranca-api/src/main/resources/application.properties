server.address=127.0.0.1
demo.password=${DEMO_PASSWORD:}
app.issuer=${JWT_ISSUER:https://id.example.invalid}
app.jwk-set-uri=${JWT_JWKS:https://id.example.invalid/.well-known/jwks.json}
app.audience=${JWT_AUDIENCE:vark-api}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Localhost usa HTTP. Na implantação com HTTPS, definir SESSION_COOKIE_SECURE=true.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
